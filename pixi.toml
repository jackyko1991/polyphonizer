# One environment for the whole repo: Node (the site, as CI uses) and Python with music21 (the Library catalogue
# scripts). From the repo root: `pixi run dev`, `pixi run test`, `pixi run build`, `pixi run catalog`.
[workspace]
name = "polyphonizer"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[dependencies]
nodejs = "24.*" # the same major version as .github/workflows/pages.yml
python = "3.13.*"

[pypi-dependencies]
# the scripts must read the corpus with the music21 the site installs in Pyodide: the latest from PyPI
music21 = "*"
claude-agent-sdk = ">=0.2.176, <0.3"

[tasks]
install = { cmd = "npm ci", cwd = "frontend", inputs = ["frontend/package.json", "frontend/package-lock.json"], outputs = ["frontend/node_modules/.package-lock.json"] }
dev = { cmd = "npm run dev --", cwd = "frontend", depends-on = ["install", "library-db"], description = "the site with hot reload" }
test = { cmd = "npm test", cwd = "frontend", depends-on = ["install"], description = "unit tests (node --test)" }
typecheck = { cmd = "npx tsc -b", cwd = "frontend", depends-on = ["install"] }
build = { cmd = "npm run build", cwd = "frontend", depends-on = ["install", "library-db"], description = "the static site in frontend/dist" }
preview = { cmd = "npm run preview", cwd = "frontend", depends-on = ["build"] }
catalog = { cmd = "python scripts/corpus_catalog.py", description = "rewrite the Library's music21 corpus catalogue" }
collections = { cmd = "python scripts/collections_catalog.py", description = "rewrite the open-licence collections catalogue (GITHUB_TOKEN used if set)" }
mutopia = { cmd = "python scripts/mutopia_catalog.py", description = "rewrite the Library's listing of the Mutopia Project (GITHUB_TOKEN used if set)" }
imslp = { cmd = "python scripts/imslp_catalog.py", description = "rewrite the Library's index of IMSLP's works (frontend/public/library/imslp.tsv; ~10 min, politely paced)" }
harmony = { cmd = "python scripts/harmony_catalog.py", description = "rewrite which Library works have a When in Rome harmonic analysis (GITHUB_TOKEN used if set)" }
library-db = { cmd = "node scripts/library-db.ts", description = "build the Library's catalogue database (frontend/public/library/library.sqlite) from the catalogue files" }
aliases = { cmd = "node scripts/composer-aliases.ts", description = "rewrite the composers' one spelling across sources (frontend/src/library/composerAliases.json)" }
runner = { cmd = "python runner/server.py", description = "the transcription runner on 127.0.0.1:8765 (Transcribe ▸ My computer)" }
test-runner = { cmd = "python -m unittest discover -s runner/tests -v", description = "the runner's tests" }

# The runner's OMR engine (Transcribe ▸ My computer ▸ PDF or photo): KobiMusic copisteria, in its own environment so the
# site's stays small. Once: pixi run omr-setup (the reader and its weights); then pixi run runner finds it.
[feature.omr]
platforms = ["osx-arm64", "linux-64", "win-64"] # PyTorch has no Intel-Mac wheels for this Python

[feature.omr.dependencies]
poppler = "*" # pdfinfo, and the reader's PDF pages
pip = "*"

[feature.omr.pypi-dependencies]
torch = "*"
torchvision = "*"
numpy = "*"
pillow = "*"
scipy = "*"
opencv-python = "*"
huggingface_hub = "*"

[feature.omr.tasks]
omr-setup = { cmd = "python runner/engines/setup_copista.py", description = "install the runner's OMR engine, KobiMusic copisteria (PDF and photos of printed music; Apache-2.0, about 131 MB of weights, PyTorch on the CPU)" }

[environments]
omr = { features = ["omr"], solve-group = "default" }
audio = { features = ["audio"], solve-group = "default" }

# The runner's sound-to-score engines (Transcribe ▸ a recording or a video): Transkun for piano (MIT; PyTorch, on the
# GPU when there is one: CUDA, or the Apple GPU) and Spotify's Basic Pitch for any one instrument or voice (Apache-2.0;
# its ONNX model, so no TensorFlow), with ffmpeg for a video's sound and librosa for the beat. Once:
# pixi run -e audio audio-setup; then pixi run runner finds them.
[feature.audio]
platforms = ["osx-arm64", "linux-64", "win-64"]

[feature.audio.dependencies]
ffmpeg = "*"
pip = "*"
cython = "*" # transkun's ncls builds from source here

[feature.audio.pypi-dependencies]
torch = "*"
torchaudio = "*"
transkun = "*"
audioop-lts = "*" # pydub (transkun reads audio with it) needs this on Python 3.13
onnxruntime = "*"
librosa = "*"
soundfile = "*"
pretty-midi = "*"
mir-eval = "*"
resampy = "*"
scikit-learn = "*"
music21 = "*"

[feature.audio.tasks]
audio-setup = { cmd = "python runner/engines/setup_audio.py", description = "finish the runner's sound-to-score engines: Basic Pitch's model (no TensorFlow), and a check that Transkun loads" }
